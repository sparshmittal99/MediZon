# Every push to main that changes the web app: test, build, and put it live on the Azure VM, like Render's auto-deploy.
# The VM is reached over Tailscale (no public SSH). deploy.sh on the VM rolls back if the new release doesn't start.
# Off until the repository variable AZURE_DEPLOY_ENABLED is "true" (Settings > Secrets and variables > Actions > Variables).
name: Deploy to Azure

on:
  push:
    branches: [main]
    paths:
      - 'medizon/**'
      - '.github/workflows/deploy-azure.yml'
  workflow_dispatch:

# One deploy at a time; a newer push waits for the running one instead of cutting it off
concurrency:
  group: deploy-azure
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: vars.AZURE_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Test and build
        working-directory: medizon
        run: mvn -B -q package

      - name: Join the tailnet
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Upload and switch over
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          set -euo pipefail
          ID="${GITHUB_SHA::12}"
          JAR="$(ls medizon/target/medizon-*.jar | head -n 1)"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          OPTS=(-i ~/.ssh/deploy -o BatchMode=yes -o ConnectTimeout=30)
          scp "${OPTS[@]}" "$JAR" "deploy@$HOST:incoming/medizon-$ID.jar"
          ssh "${OPTS[@]}" "deploy@$HOST" "sudo /opt/medizon/bin/deploy.sh $ID"
