<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${form.id == null} ? 'Add medicine' : 'Edit medicine')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div th:replace="~{fragments/layout :: flash}"></div>

<main class="container mz-page" style="max-width: 860px">
    <a th:href="@{/plans}" class="small"><i class="bi bi-arrow-left"></i> My medicines</a>
    <h1 class="mz-page-title mt-2 mb-4" th:text="${form.id == null} ? 'Add a medicine' : 'Edit medicine'">Add a medicine</h1>

    <form th:action="@{/plans/save}" th:object="${form}" method="post" novalidate>
        <input type="hidden" th:field="*{id}">

        <section class="mz-panel mb-4">
            <h2 class="h5 mb-3">Medicine and dose</h2>
            <div class="row g-3">
                <div class="col-md-8">
                    <label class="form-label" for="medicineId">Medicine</label>
                    <select class="form-select" th:field="*{medicineId}" th:errorclass="is-invalid">
                        <option value="">Choose a medicine</option>
                        <option th:each="m : ${medicines}" th:value="${m.id}"
                                th:text="${m.name} + ' (pack of ' + ${m.unitsPerPack} + ' ' + ${m.unitLabel} + ')'"></option>
                    </select>
                    <div class="invalid-feedback" th:errors="*{medicineId}"></div>
                </div>
                <div class="col-md-4">
                    <label class="form-label" for="dosePerIntake">Dose each time</label>
                    <input class="form-control" type="number" min="1" th:field="*{dosePerIntake}" th:errorclass="is-invalid">
                    <div class="form-text">Tablets, capsules or ml</div>
                    <div class="invalid-feedback" th:errors="*{dosePerIntake}"></div>
                </div>
                <div class="col-12">
                    <label class="form-label">Reminder times</label>
                    <div class="row g-2">
                        <div class="col-6 col-md-3" th:each="t, s : *{times}">
                            <input class="form-control" type="time" name="times" th:value="${t}" th:aria-label="'Reminder time ' + ${s.count}">
                        </div>
                    </div>
                    <div class="form-text">Leave unused boxes empty.</div>
                </div>
                <div class="col-md-4">
                    <label class="form-label" for="startDate">Start</label>
                    <input class="form-control" type="date" th:field="*{startDate}">
                </div>
                <div class="col-md-4">
                    <label class="form-label" for="endDate">End <span class="text-muted fw-normal">(optional)</span></label>
                    <input class="form-control" type="date" th:field="*{endDate}">
                </div>
                <div class="col-md-4">
                    <label class="form-label" for="instructions">Instructions</label>
                    <input class="form-control" th:field="*{instructions}" placeholder="after food">
                </div>
            </div>
        </section>

        <section class="mz-panel mb-4">
            <h2 class="h5 mb-1">Supply and refills</h2>
            <p class="small text-muted mb-3">Tell us how much you have now. We deduct each dose and act before you run out.</p>
            <div class="row g-3">
                <div class="col-md-4">
                    <label class="form-label" for="unitsRemaining">Units at home now</label>
                    <input class="form-control" type="number" min="0" th:field="*{unitsRemaining}" th:errorclass="is-invalid">
                    <div class="invalid-feedback" th:errors="*{unitsRemaining}"></div>
                </div>
                <div class="col-md-4">
                    <label class="form-label" for="reorderThresholdDays">Act when supply is down to</label>
                    <div class="input-group">
                        <input class="form-control" type="number" min="1" max="30" th:field="*{reorderThresholdDays}" th:errorclass="is-invalid">
                        <span class="input-group-text">days</span>
                    </div>
                </div>
                <div class="col-md-4">
                    <label class="form-label" for="reorderPacks">Packs per refill</label>
                    <input class="form-control" type="number" min="1" max="20" th:field="*{reorderPacks}" th:errorclass="is-invalid">
                </div>
                <div class="col-12">
                    <label class="form-label d-block">When supply runs low</label>
                    <div class="form-check" th:each="mode : ${reorderModes}">
                        <input class="form-check-input" type="radio" th:field="*{reorderMode}" th:value="${mode}">
                        <label class="form-check-label" th:for="${#ids.prev('reorderMode')}">
                            <span class="fw-semibold" th:text="${mode.label}"></span>
                            <span class="small text-muted" th:switch="${mode.name()}">
                                <span th:case="'MANUAL'">: we notify you and you reorder with one tap.</span>
                                <span th:case="'AUTO'">: we place a cash-on-delivery order to your saved address. Rx medicines need an approved prescription on file.</span>
                                <span th:case="*">: reminders only.</span>
                            </span>
                        </label>
                    </div>
                </div>
            </div>
        </section>

        <div class="d-flex gap-2">
            <button class="btn btn-primary" type="submit">Save medicine</button>
            <a th:href="@{/plans}" class="btn btn-outline-secondary">Cancel</a>
        </div>
    </form>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
