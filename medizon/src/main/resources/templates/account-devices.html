<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Signed-in devices')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div th:replace="~{fragments/layout :: flash}"></div>

<main class="container mz-page mz-w-devices">
    <a th:href="@{/account} + '#devices'" class="mz-back-link small"><i class="bi bi-arrow-left"></i> Account settings</a>
    <h1 class="mz-page-title mt-2 mb-3">Signed-in devices</h1>

    <div class="mz-panel-flush mb-3">
        <div th:each="d : ${devices}" class="mz-device-row">
            <span class="mz-device-icon" aria-hidden="true">
                <i th:class="${d.phone} ? 'bi bi-phone' : (${d.tablet} ? 'bi bi-tablet' : 'bi bi-laptop')"></i>
            </span>
            <div class="flex-grow-1 min-w-0">
                <div class="fw-semibold text-truncate" th:text="${d.label} ?: 'Device'">Chrome on Windows</div>
                <div class="small text-muted" th:text="${#temporals.format(d.signedInAt, 'd MMM yyyy, h:mm a')}">6 Nov 2026, 3:20 PM</div>
            </div>
            <span th:if="${d.current}" class="badge rounded-pill text-bg-success">This device</span>
            <form th:unless="${d.current}" th:action="@{/account/devices/{id}/sign-out(id=${d.id})}" method="post"
                  th:attr="data-mz-confirm=${d.label} + ' will need to sign in again.'"
                  data-mz-confirm-title="Sign out this device?" data-mz-confirm-ok="Sign out">
                <button class="btn btn-sm btn-outline-danger text-nowrap" type="submit">Sign out</button>
            </form>
        </div>
    </div>

    <form th:if="${#lists.size(devices) > 1}" th:action="@{/account/sign-out-others}" method="post"
          data-mz-confirm="You'll stay signed in here. Every other device will need to sign in again."
          data-mz-confirm-title="Sign out all other devices?" data-mz-confirm-ok="Sign them out">
        <button class="btn btn-danger w-100 py-2" type="submit">
            <i class="bi bi-box-arrow-right me-1"></i>Sign out all other devices</button>
    </form>
    <p th:unless="${#lists.size(devices) > 1}" class="small text-muted text-center mb-0">You're signed in on this device only.</p>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
