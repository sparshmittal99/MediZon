<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Cart')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div th:replace="~{fragments/layout :: flash}"></div>

<main class="container mz-page">
    <h1 class="mz-page-title mb-4">Your cart</h1>

    <div th:if="${cart.empty}" class="mz-panel mz-empty">
        <i class="bi bi-bag"></i>
        <p class="mb-3">Your cart is empty.</p>
        <a th:href="@{/medicines}" class="btn btn-primary">Browse medicines</a>
    </div>

    <div class="row g-4" th:unless="${cart.empty}">
        <div class="col-lg-8">
            <div class="mz-panel-flush">
                <div class="table-responsive">
                    <table class="table align-middle mb-0">
                        <thead><tr><th>Medicine</th><th style="width: 9rem">Packs</th><th class="text-end">Amount</th><th></th></tr></thead>
                        <tbody>
                        <tr th:each="i : ${cart.items}" data-mz-cart-row>
                            <td>
                                <a class="fw-semibold text-decoration-none" th:href="@{/medicines/{id}(id=${i.medicine.id})}" th:text="${i.medicine.name}">Name</a>
                                <span th:if="${i.medicine.prescriptionRequired}" class="mz-rx position-static ms-1">Rx</span>
                                <div class="small text-muted" th:text="'₹' + ${i.medicine.price} + ' per pack of ' + ${i.medicine.unitsPerPack}"></div>
                            </td>
                            <td>
                                <div th:replace="~{fragments/layout :: cartStepper(${i.medicine}, false)}"></div>
                            </td>
                            <td class="text-end fw-semibold" data-mz-line-total
                                th:text="'₹' + ${#numbers.formatDecimal(i.lineTotal, 1, 'COMMA', 2, 'POINT')}"></td>
                            <td class="text-end">
                                <form th:action="@{/cart/{id}/remove(id=${i.id})}" method="post">
                                    <button class="btn btn-sm btn-link text-danger" type="submit" aria-label="Remove"><i class="bi bi-trash"></i></button>
                                </form>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
        <div class="col-lg-4">
            <div class="mz-panel" data-mz-cart-summary>
                <h2 class="h5 mb-3">Summary</h2>
                <div class="d-flex justify-content-between mb-2"><span>Subtotal</span>
                    <span data-mz-subtotal th:text="'₹' + ${#numbers.formatDecimal(cart.subtotal, 1, 'COMMA', 2, 'POINT')}"></span></div>
                <div class="d-flex justify-content-between mb-2"><span>Delivery</span>
                    <span data-mz-delivery th:text="${cart.deliveryFee.signum() == 0} ? 'Free' : ('₹' + ${cart.deliveryFee})"></span></div>
                <p class="small text-muted" data-mz-free-note th:hidden="${cart.deliveryFee.signum() == 0}"
                   th:text="'Free delivery on orders of ₹' + ${freeAbove} + ' or more.'"></p>
                <hr>
                <div class="d-flex justify-content-between fw-bold fs-5 mb-3"><span>Total</span>
                    <span data-mz-total th:text="'₹' + ${#numbers.formatDecimal(cart.total, 1, 'COMMA', 2, 'POINT')}"></span></div>
                <div class="mz-rx-note small mb-3" data-mz-rx-note th:hidden="${!cart.prescriptionRequired}">
                    Some items need a prescription. You'll choose or upload one at checkout.
                </div>
                <a th:href="@{/checkout}" class="btn btn-primary w-100">Go to checkout</a>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
