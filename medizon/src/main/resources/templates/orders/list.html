<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Orders')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div th:replace="~{fragments/layout :: flash}"></div>

<main class="container mz-page">
    <div class="d-flex flex-wrap justify-content-between align-items-end gap-2 mb-4">
        <h1 class="mz-page-title mb-0">Your orders</h1>
        <th:block th:if="${hasOrders}"><div th:replace="~{fragments/layout :: periodFilter(@{/orders}, ${ {'tab': tab} })}"></div></th:block>
    </div>

    <div th:unless="${hasOrders}" class="mz-panel mz-empty">
        <i class="bi bi-box-seam"></i>
        <p class="mb-3">You haven't placed an order yet.</p>
        <a th:href="@{/medicines}" class="btn btn-primary">Browse medicines</a>
    </div>

    <th:block th:if="${hasOrders}">
        <nav class="mz-order-tabs mb-4" aria-label="Order sections">
            <a th:each="t : ${ {'pending', 'completed', 'cancelled', 'returns'} }"
               th:href="@{/orders(tab=${t}, year=${period.yearParams}, month=${period.monthParams}, date=${period.dateParams})}"
               class="mz-order-tab" th:classappend="${tab == t} ? 'active'" th:attr="aria-current=${tab == t} ? 'page'">
                <i class="bi" th:classappend="${t == 'pending'} ? 'bi-truck' : (${t == 'completed'} ? 'bi-check2-circle' : (${t == 'cancelled'} ? 'bi-x-circle' : 'bi-arrow-return-left'))"
                   aria-hidden="true"></i>
                <span th:text="${#strings.capitalize(t)}">Pending</span>
                <span class="mz-order-tab-count" th:text="${counts.get(t)}">0</span>
            </a>
        </nav>
        <p class="small text-muted mt-n2 mb-3" th:text="'Your newest ' + ${limit} + (${tab == 'returns'} ? ' returns requested' : ' orders placed') + ' in ' + ${period.label} + '.'"></p>

        <!-- Pending, completed, cancelled -->
        <th:block th:unless="${tab == 'returns'}">
            <div th:if="${#lists.isEmpty(orders)}" class="mz-panel mz-empty">
                <i class="bi" th:classappend="${tab == 'pending'} ? 'bi-truck' : (${tab == 'completed'} ? 'bi-check2-circle' : 'bi-x-circle')"></i>
                <p class="mb-0" th:switch="${tab}">
                    <span th:case="'pending'">Nothing on its way right now.</span>
                    <span th:case="'completed'">No delivered orders yet.</span>
                    <span th:case="*">No cancelled orders.</span>
                </p>
            </div>
            <div th:unless="${#lists.isEmpty(orders)}" class="mz-panel-flush">
                <div class="table-responsive">
                    <table class="table align-middle mb-0 mz-table-stack">
                        <thead><tr>
                            <th>Order</th><th>Placed</th>
                            <th th:text="${tab == 'completed'} ? 'Delivered' : (${tab == 'cancelled'} ? 'Cancelled' : 'Items')">Items</th>
                            <th>Total</th><th>Status</th><th></th>
                        </tr></thead>
                        <tbody>
                        <tr th:each="o : ${orders}" th:with="ret=${latestReturn.get(o.id)}">
                            <td>
                                <span class="fw-semibold" th:text="${o.orderNumber}"></span>
                                <span th:if="${o.autoReorder}" class="badge mz-auto-badge ms-1">Auto refill</span>
                                <div class="small text-muted" th:text="${o.itemCount} + ' pack(s)'" th:unless="${tab == 'pending'}"></div>
                            </td>
                            <td data-label="Placed" th:text="${#temporals.format(o.createdAt, 'd MMM yyyy')}"></td>
                            <td th:switch="${tab}" th:attr="data-label=${tab == 'completed'} ? 'Delivered' : (${tab == 'cancelled'} ? 'Cancelled' : 'Items')">
                                <span th:case="'completed'" th:text="${o.deliveredAt != null} ? ${#temporals.format(o.deliveredAt, 'd MMM yyyy')} : '-'"></span>
                                <span th:case="'cancelled'" th:text="${#temporals.format(o.updatedAt, 'd MMM yyyy')}"></span>
                                <span th:case="*" th:text="${o.itemCount} + ' pack(s)'"></span>
                            </td>
                            <td data-label="Total" th:text="'₹' + ${#numbers.formatDecimal(o.total, 1, 'COMMA', 2, 'POINT')}"></td>
                            <td data-label="Status">
                                <span class="badge" th:classappend="${o.status.badge}" th:text="${o.status.label}"></span>
                                <a th:if="${ret != null}" th:href="@{/orders(tab='returns', year=${ret.createdAt.year})}" class="d-block small mt-1"
                                   th:text="${ret.status.name() == 'REFUNDED'} ? 'Returned, refunded' : (${ret.open} ? 'Return in progress' : 'Return ' + ${#strings.toLowerCase(ret.status.label)})"></a>
                            </td>
                            <td class="text-end text-nowrap mz-td-actions">
                                <a th:if="${o.invoiceAvailable}" th:href="@{/orders/{id}/invoice(id=${o.id})}" class="btn btn-sm btn-link">Invoice</a>
                                <a th:href="@{/orders/{id}(id=${o.id})}" class="btn btn-sm btn-outline-primary">View</a>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </th:block>

        <!-- Returns -->
        <th:block th:if="${tab == 'returns'}">
            <div th:if="${#lists.isEmpty(returns)}" class="mz-panel mz-empty">
                <i class="bi bi-arrow-return-left"></i>
                <p class="mb-0">No returns.</p>
            </div>
            <div th:unless="${#lists.isEmpty(returns)}" class="mz-panel-flush">
                <div class="table-responsive">
                    <table class="table align-middle mb-0 mz-table-stack">
                        <thead><tr><th>Return</th><th>Order</th><th>Items</th><th>Requested</th><th>Refund</th><th>Status</th></tr></thead>
                        <tbody>
                        <tr th:each="r : ${returns}">
                            <td>
                                <span class="fw-semibold" th:text="${r.returnNumber}"></span>
                                <div class="small text-muted" th:text="${r.reason.label}"></div>
                            </td>
                            <td data-label="Order"><a th:href="@{/orders/{id}(id=${r.order.id})}" th:text="${r.order.orderNumber}"></a></td>
                            <td class="small" data-label="Items">
                                <div th:each="ri : ${r.items}" th:text="${ri.quantity} + ' × ' + ${ri.orderItem.medicineName}"></div>
                            </td>
                            <td data-label="Requested" th:text="${#temporals.format(r.createdAt, 'd MMM yyyy')}"></td>
                            <td data-label="Refund" th:text="'₹' + ${r.refundAmount}"></td>
                            <td data-label="Status"><span class="badge" th:classappend="${r.status.badge}" th:text="${r.status.label}"></span>
                                <div th:if="${r.adminNote}" class="small text-muted mt-1" th:text="${r.adminNote}"></div></td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </th:block>
    </th:block>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
