<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Forgot Password')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="container">
    <div class="mz-auth mz-panel">
        <h1 class="h3 mb-1">Forgot password</h1>
        <p class="text-muted mb-4">Enter your email to receive a 6-digit verification code.</p>

        <!-- Modern Custom Alert for Error -->
        <div th:if="${error}" class="p-3 mb-4 rounded-3 d-flex align-items-start gap-3"
             style="background: linear-gradient(135deg, #FEF2F2 0%, #FFF5F5 100%); border: 1px solid #FECACA; box-shadow: 0 2px 10px rgba(239, 68, 68, 0.06);" role="alert">
            <div class="flex-shrink-0" style="width: 36px; height: 36px; background-color: #FEE2E2; border-radius: 50%; display: flex; align-items: center; justify-content: center;">
                <i class="bi bi-shield-x text-danger fs-5"></i>
            </div>
            <div class="flex-grow-1">
                <div class="fw-bold" style="color: #991B1B; font-size: 0.95rem;">Request failed</div>
                <div class="small mt-1" style="color: #B91C1C; line-height: 1.45;" th:text="${error}">
                    Could not initiate password reset.
                </div>
            </div>
        </div>

        <form th:action="@{/forgot-password}" method="post">
            <div class="mb-4">
                <label class="form-label" for="email">Email</label>
                <input class="form-control" id="email" name="email" type="email" autocomplete="email" required autofocus
                       placeholder="name@example.com" th:value="${email}">
            </div>
            <button class="btn btn-primary w-100" type="submit">Send verification code</button>
        </form>

        <p class="small text-center mt-4 mb-0">
            Remember your password? <a th:href="@{/login}">Back to sign in</a>
        </p>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
