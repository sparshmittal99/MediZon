<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Return items')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div th:replace="~{fragments/layout :: flash}"></div>

<main class="container mz-page" style="max-width: 820px">
    <a th:href="@{/orders/{id}(id=${o.id})}" class="small"><i class="bi bi-arrow-left"></i> <span th:text="'Order ' + ${o.orderNumber}"></span></a>
    <h1 class="mz-page-title mt-2">Return items</h1>
    <p class="text-muted mb-4" th:text="'Return by ' + ${#temporals.format(returnBy, 'd MMMM yyyy')}"></p>

    <form th:action="@{/orders/{id}/return(id=${o.id})}" method="post" enctype="multipart/form-data" novalidate>
        <section class="mz-panel-flush mb-4">
            <div class="table-responsive">
                <table class="table align-middle mb-0">
                    <thead><tr><th>Medicine</th><th>Price paid</th><th style="width: 9rem">Packs to return</th></tr></thead>
                    <tbody>
                    <tr th:each="i : ${o.items}" th:if="${i.returnable}" th:with="left=${returnable.get(i.id)}">
                        <td>
                            <span class="fw-semibold" th:text="${i.medicineName}"></span>
                            <div class="small text-muted" th:if="${!#lists.isEmpty(i.sortedMembers)}" th:text="'For ' + ${i.membersLabel}"></div>
                            <div class="small text-muted" th:text="${left} + ' of ' + ${i.quantity} + ' pack(s) can be returned'"></div>
                        </td>
                        <td th:text="'₹' + ${i.unitPrice} + ' / pack'"></td>
                        <td>
                            <!-- itemId and qty are posted as matching lists, so both are left out together -->
                            <th:block th:if="${left > 0}">
                                <input type="hidden" name="itemId" th:value="${i.id}">
                                <input class="form-control" type="number" name="qty" min="0" th:max="${left}" value="0"
                                       th:aria-label="'Packs of ' + ${i.medicineName} + ' to return'">
                            </th:block>
                            <span th:if="${left == 0}" class="small text-muted">Already returned</span>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
            <p class="small text-muted px-3 py-2 mb-0 border-top" th:with="fixed=${o.items.?[!returnable]}" th:unless="${#lists.isEmpty(fixed)}"
               th:text="'Not returnable: ' + ${#strings.listJoin(fixed.![medicineName], ', ')}"></p>
        </section>

        <section class="mz-panel mb-4">
            <h2 class="h5 mb-3">What's wrong?</h2>
            <div class="form-check mb-2" th:each="r, s : ${reasons}">
                <input class="form-check-input" type="radio" name="reason" th:id="'reason' + ${s.index}" th:value="${r}" required>
                <label class="form-check-label" th:for="'reason' + ${s.index}" th:text="${r.label}">Damaged</label>
            </div>
            <label class="form-label mt-3" for="details">Details <span class="text-muted fw-normal">(required for "Something else")</span></label>
            <textarea class="form-control" id="details" name="details" rows="3" maxlength="1000"
                      placeholder="Batch number, what you noticed, anything that helps the pharmacist"></textarea>
        </section>

        <section class="mz-panel mb-4">
            <h2 class="h5 mb-1">Photos</h2>
            <p class="small text-muted" th:text="'Add 1 to ' + ${maxImages} + ' clear photos of the medicine, its strip or bottle, and the batch / expiry label. JPG, PNG or WebP, up to 5 MB each.'"></p>
            <input class="form-control" type="file" name="images" accept="image/jpeg,image/png,image/webp,image/gif" multiple required
                   data-mz-return-photos th:attr="data-max=${maxImages}">
            <div class="mz-photo-previews mt-3" data-mz-photo-previews></div>
            <div class="mz-qty-error small" data-mz-photo-error role="alert" hidden></div>
        </section>

        <div class="d-flex gap-2">
            <button class="btn btn-primary" type="submit"><i class="bi bi-send me-1"></i>Request return</button>
            <a th:href="@{/orders/{id}(id=${o.id})}" class="btn btn-outline-secondary">Cancel</a>
        </div>
    </form>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
