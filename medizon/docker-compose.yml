services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: medizon
      POSTGRES_USER: medizon
      POSTGRES_PASSWORD: medizon
    ports:
      - "5432:5432"
    volumes:
      - medizon-db:/var/lib/postgresql/data

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_started
      # Optional: the shop starts and runs without it (chat falls back to Gemini, or says it's offline)
      assistant:
        condition: service_started
        required: false
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://db:5432/medizon
      DB_USER: medizon
      DB_PASSWORD: medizon
      MEDIZON_TZ: Asia/Kolkata
      ASSISTANT_URL: http://assistant:8001
      ASSISTANT_TOKEN: ${ASSISTANT_TOKEN:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      MEDIZON_ADMIN_EMAIL: ${MEDIZON_ADMIN_EMAIL:-}
      MEDIZON_ADMIN_PASSWORD: ${MEDIZON_ADMIN_PASSWORD:-}
      UPLOAD_DIR: /data/uploads
    volumes:
      - medizon-uploads:/data/uploads
    profiles: ["app"]   # `docker compose --profile app up` runs the app too

  assistant:
    build: ../medizon-assistant
    restart: unless-stopped
    environment:
      ASSISTANT_TOKEN: ${ASSISTANT_TOKEN:-}
    ports:
      - "8001:8001"
    profiles: ["app"]

volumes:
  medizon-db:
  medizon-uploads:
