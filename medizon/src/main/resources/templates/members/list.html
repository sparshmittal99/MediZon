<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Family members')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div th:replace="~{fragments/layout :: flash}"></div>

<main class="container mz-page" style="max-width: 900px">
    <a th:href="@{/plans}" class="small"><i class="bi bi-arrow-left"></i> My medicines</a>
    <h1 class="mz-page-title mt-2 mb-4">Family members</h1>

    <div class="row g-3 mb-4">
        <div class="col-md-6" th:each="m : ${people}">
            <article class="mz-panel h-100">
                <div class="d-flex align-items-center gap-3">
                    <span class="mz-avatar mz-avatar-lg" th:text="${m.initial}" aria-hidden="true">M</span>
                    <div class="flex-grow-1">
                        <h2 class="h6 mb-0" th:text="${m.self} ? ${m.name} + ' (you)' : ${m.name}">Name</h2>
                        <div class="small text-muted">
                            <span th:if="${m.relation}" th:text="${m.relation} + ' · '"></span>
                            <span th:text="${planCounts.getOrDefault(m.id, 0L)} + ' medicine(s)'"></span>
                        </div>
                    </div>
                    <a class="btn btn-sm btn-outline-primary" th:href="@{/plans(member=${m.id})}">Medicines</a>
                </div>
                <details class="mt-3" th:unless="${m.self}">
                    <summary class="small">Edit or remove</summary>
                    <form th:action="@{/members}" method="post" class="row g-2 mt-1">
                        <input type="hidden" name="id" th:value="${m.id}">
                        <div class="col-sm-6">
                            <label class="form-label small" th:for="'name' + ${m.id}">Name</label>
                            <input class="form-control form-control-sm" th:id="'name' + ${m.id}" name="name" th:value="${m.name}" maxlength="60" required>
                        </div>
                        <div class="col-sm-6">
                            <label class="form-label small" th:for="'pat' + ${m.id}">Patient name</label>
                            <input class="form-control form-control-sm" th:id="'pat' + ${m.id}" name="patientName" th:value="${m.patientName}"
                                   maxlength="100" required placeholder="As on prescriptions">
                        </div>
                        <div class="col-sm-6">
                            <label class="form-label small" th:for="'rel' + ${m.id}">Relation</label>
                            <input class="form-control form-control-sm" th:id="'rel' + ${m.id}" name="relation" th:value="${m.relation}"
                                   maxlength="40" list="relations">
                        </div>
                        <div class="col-12 d-flex gap-2">
                            <button class="btn btn-sm btn-primary" type="submit">Save</button>
                        </div>
                    </form>
                    <form th:action="@{/members/{id}/remove(id=${m.id})}" method="post" class="mt-2"
                          th:attr="data-mz-confirm='Remove ' + ${m.name} + '? Their reminders stop; past orders keep their name.'"
                          data-mz-confirm-title="Remove family member" data-mz-confirm-ok="Remove">
                        <button class="btn btn-sm btn-link text-danger p-0" type="submit"><i class="bi bi-trash me-1"></i>Remove</button>
                    </form>
                </details>
            </article>
        </div>
        <div class="col-md-6">
            <article class="mz-panel h-100 mz-panel-soft">
                <div class="d-flex align-items-center gap-3">
                    <span class="mz-avatar mz-avatar-lg is-common" aria-hidden="true"><i class="bi bi-house-heart"></i></span>
                    <div class="flex-grow-1">
                        <h2 class="h6 mb-0">Common medicines</h2>
                        <div class="small text-muted" th:text="'Shared OTC medicines for the household · ' + ${planCounts.getOrDefault(common.id, 0L)} + ' medicine(s)'"></div>
                    </div>
                    <a class="btn btn-sm btn-outline-primary" th:href="@{/plans(member=${common.id})}">Medicines</a>
                </div>
            </article>
        </div>
    </div>

    <section class="mz-panel" th:if="${#lists.size(people) <= maxFamily}">
        <h2 class="h5 mb-3">Add a family member</h2>
        <form th:action="@{/members}" method="post" class="row g-3 align-items-end">
            <div class="col-sm-6 col-lg-3">
                <label class="form-label" for="newName">Name</label>
                <input class="form-control" id="newName" name="name" maxlength="60" required placeholder="Mom">
            </div>
            <div class="col-sm-6 col-lg-4">
                <label class="form-label" for="newPatient">Patient name</label>
                <input class="form-control" id="newPatient" name="patientName" maxlength="100" required placeholder="Asha Sharma"
                       aria-describedby="newPatientHelp">
            </div>
            <div class="col-sm-6 col-lg-3">
                <label class="form-label" for="newRelation">Relation <span class="text-muted fw-normal">(optional)</span></label>
                <input class="form-control" id="newRelation" name="relation" maxlength="40" list="relations" placeholder="Mother">
            </div>
            <div class="col-sm-6 col-lg-2"><button class="btn btn-primary w-100" type="submit"><i class="bi bi-person-plus me-1"></i>Add</button></div>
            <div class="col-12 form-text mt-1" id="newPatientHelp">Full name as doctors write it on prescriptions. It's printed on invoices,
                and medicines from an uploaded prescription go to whoever's name is on it.</div>
        </form>
        <datalist id="relations">
            <option value="Mother"><option value="Father"><option value="Spouse"><option value="Son"><option value="Daughter">
            <option value="Grandmother"><option value="Grandfather"><option value="Brother"><option value="Sister">
        </datalist>
    </section>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
