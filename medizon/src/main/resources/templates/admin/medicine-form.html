<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${medicine.id == null} ? 'Add medicine' : 'Edit medicine')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div th:replace="~{fragments/layout :: adminNav}"></div>
<div th:replace="~{fragments/layout :: flash}"></div>

<main class="container mz-page" style="max-width: 900px">
    <a th:href="@{/admin/medicines}" class="small"><i class="bi bi-arrow-left"></i> Catalog</a>
    <h1 class="mz-page-title mt-2 mb-4" th:text="${medicine.id == null} ? 'Add medicine' : ('Edit ' + ${medicine.name})">Medicine</h1>

    <form th:action="@{/admin/medicines/save}" th:object="${medicine}" method="post" class="mz-panel"
          enctype="multipart/form-data" novalidate>
        <input type="hidden" th:field="*{id}">
        <div class="row g-3">
            <div class="col-md-6">
                <label class="form-label" for="name">Name</label>
                <input class="form-control" th:field="*{name}" th:errorclass="is-invalid">
                <div class="invalid-feedback" th:errors="*{name}"></div>
            </div>
            <div class="col-md-6">
                <label class="form-label" for="genericName">Salt / composition</label>
                <input class="form-control" th:field="*{genericName}">
            </div>
            <div class="col-md-4">
                <label class="form-label" for="manufacturer">Manufacturer</label>
                <input class="form-control" th:field="*{manufacturer}">
            </div>
            <div class="col-md-4">
                <label class="form-label" for="category">Category</label>
                <input class="form-control" th:field="*{category}" list="categoryList" th:errorclass="is-invalid">
                <datalist id="categoryList"><option th:each="c : ${categories}" th:value="${c}"></option></datalist>
                <div class="invalid-feedback" th:errors="*{category}"></div>
            </div>
            <div class="col-md-4">
                <label class="form-label" for="dosageForm">Form</label>
                <input class="form-control" th:field="*{dosageForm}" list="formList" th:errorclass="is-invalid">
                <datalist id="formList"><option value="Tablet"><option value="Capsule"><option value="Syrup"><option value="Sachet"><option value="Drops"><option value="Injection"><option value="Device"></datalist>
                <div class="invalid-feedback" th:errors="*{dosageForm}"></div>
            </div>
            <div class="col-md-3">
                <label class="form-label" for="price">Price (₹)</label>
                <input class="form-control" type="number" step="0.01" min="0" th:field="*{price}" th:errorclass="is-invalid">
                <div class="invalid-feedback" th:errors="*{price}"></div>
            </div>
            <div class="col-md-3">
                <label class="form-label" for="mrp">MRP (₹)</label>
                <input class="form-control" type="number" step="0.01" min="0" th:field="*{mrp}">
            </div>
            <div class="col-md-3">
                <label class="form-label" for="unitsPerPack">Units per pack</label>
                <input class="form-control" type="number" min="1" th:field="*{unitsPerPack}" th:errorclass="is-invalid">
                <div class="invalid-feedback" th:errors="*{unitsPerPack}"></div>
            </div>
            <div class="col-md-3">
                <label class="form-label" for="stock">Stock (packs)</label>
                <input class="form-control" type="number" min="0" th:field="*{stock}" th:errorclass="is-invalid">
                <div class="invalid-feedback" th:errors="*{stock}"></div>
            </div>
            <div class="col-md-6">
                <label class="form-label" for="strength">Strength</label>
                <input class="form-control" th:field="*{strength}" placeholder="500 mg">
            </div>

            <div class="col-12" data-mz-image-picker>
                <span class="form-label d-block">Product image <span class="text-muted fw-normal">(optional)</span></span>
                <div class="mz-image-picker">
                    <div class="mz-image-preview" aria-hidden="true">
                        <img th:src="${medicine.imageUrl != null} ? @{${medicine.imageUrl}} : ''" th:classappend="${medicine.imageUrl == null} ? 'd-none'"
                             alt="" data-mz-image-preview>
                        <i class="bi" th:classappend="${medicine.icon} + (${medicine.imageUrl != null} ? ' d-none' : '')" data-mz-image-placeholder></i>
                    </div>
                    <div class="flex-grow-1">
                        <ul class="nav nav-pills mz-image-tabs mb-2" role="tablist">
                            <li class="nav-item" role="presentation">
                                <button class="nav-link active" type="button" role="tab" data-bs-toggle="pill" data-bs-target="#imgUpload"
                                        aria-controls="imgUpload" aria-selected="true"><i class="bi bi-upload me-1"></i>Upload</button>
                            </li>
                            <li class="nav-item" role="presentation">
                                <button class="nav-link" type="button" role="tab" data-bs-toggle="pill" data-bs-target="#imgLink"
                                        aria-controls="imgLink" aria-selected="false"><i class="bi bi-link-45deg me-1"></i>Image link</button>
                            </li>
                        </ul>
                        <div class="tab-content">
                            <div class="tab-pane fade show active" id="imgUpload" role="tabpanel">
                                <input class="form-control" type="file" name="imageFile" id="imageFile"
                                       accept="image/jpeg,image/png,image/webp,image/gif" aria-label="Upload product image">
                                <div class="form-text">JPG, PNG, WebP or GIF, up to 5 MB.</div>
                            </div>
                            <div class="tab-pane fade" id="imgLink" role="tabpanel">
                                <input class="form-control" type="url" name="imageLink" id="imageLink"
                                       placeholder="https://example.com/photo.jpg" aria-label="Image link">
                                <div class="form-text">Paste a direct link to an image.</div>
                            </div>
                        </div>
                        <div class="form-check mt-2" th:if="${medicine.imageUrl != null}">
                            <input class="form-check-input" type="checkbox" name="removeImage" value="true" id="removeImage">
                            <label class="form-check-label small" for="removeImage">Remove the current image</label>
                        </div>
                        <div class="form-text" th:if="${medicine.id != null and medicine.imageUrl != null}">Leave both empty to keep the current image.</div>
                    </div>
                </div>
            </div>
            <div class="col-12">
                <label class="form-label" for="description">Description</label>
                <textarea class="form-control" rows="3" th:field="*{description}"></textarea>
            </div>
            <div class="col-md-6">
                <div class="form-check form-switch">
                    <input class="form-check-input" type="checkbox" th:field="*{prescriptionRequired}">
                    <label class="form-check-label" th:for="${#ids.prev('prescriptionRequired')}">Prescription required</label>
                </div>
            </div>
            <div class="col-md-6">
                <div class="form-check form-switch">
                    <input class="form-check-input" type="checkbox" th:field="*{active}">
                    <label class="form-check-label" th:for="${#ids.prev('active')}">Listed in the shop</label>
                </div>
            </div>
        </div>
        <button class="btn btn-primary mt-4" type="submit">Save medicine</button>
    </form>
</main>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
