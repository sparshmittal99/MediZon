<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Profile')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div th:replace="~{fragments/layout :: flash}"></div>

<main class="container mz-page" style="max-width: 760px">
    <h1 class="mz-page-title mb-4">Profile and addresses</h1>

    <form th:action="@{/profile}" th:object="${form}" method="post" class="mz-panel" novalidate>
        <input type="hidden" name="returnTo" th:if="${param.returnTo}" th:value="${param.returnTo}">
        <div class="row g-3">
            <div class="col-md-6">
                <label class="form-label" for="fullName">Full name</label>
                <input class="form-control" th:field="*{fullName}" th:errorclass="is-invalid" autocomplete="name">
                <div class="invalid-feedback" th:errors="*{fullName}"></div>
            </div>
            <div class="col-md-6">
                <label class="form-label" for="phone">Mobile number</label>
                <input class="form-control" type="tel" th:field="*{phone}" th:errorclass="is-invalid" autocomplete="tel">
                <div class="invalid-feedback" th:errors="*{phone}"></div>
            </div>
        </div>
        <button class="btn btn-primary mt-4" type="submit">Save profile</button>
    </form>

    <section class="mz-panel mt-4" th:if="${addresses != null}">
        <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
            <h2 class="h5 mb-0">Delivery addresses</h2>
            <div class="d-flex gap-2">
                <a th:href="@{/addresses/new}" class="btn btn-sm btn-primary"><i class="bi bi-plus-lg me-1"></i>Add address</a>
                <a th:href="@{/addresses}" class="btn btn-sm btn-outline-primary">Manage</a>
            </div>
        </div>
        <p th:if="${#lists.isEmpty(addresses)}" class="small text-muted mb-0">No saved addresses yet. Add one to place orders.</p>
        <div th:each="a : ${addresses}" class="d-flex gap-2 py-2 border-top small">
            <i class="bi text-success" th:classappend="${a.type.icon}" aria-hidden="true"></i>
            <div>
                <strong th:text="${a.label}"></strong>
                <span th:if="${a.defaultAddress}" class="badge text-bg-light ms-1">Default</span>
                <div class="text-muted" th:text="${a.receiverName} + ' · ' + ${a.formatted}"></div>
            </div>
        </div>
    </section>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
