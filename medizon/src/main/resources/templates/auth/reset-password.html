<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Set new password')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="container">
    <div class="mz-auth mz-panel">
        <h1 class="h3 mb-1">Set new password</h1>
        <p class="text-muted mb-4">Choose a strong password for your account.</p>

        <!-- Inline alert if server returns error -->
        <div th:if="${error}" class="alert alert-danger d-flex align-items-center gap-2 mb-4 py-2 px-3 small rounded-3" role="alert">
            <i class="bi bi-exclamation-circle-fill flex-shrink-0 text-danger"></i>
            <span th:text="${error}">An error occurred.</span>
        </div>

        <form id="resetPasswordForm" th:action="@{/reset-password}" method="post" autocomplete="off">
            <input type="hidden" name="token" th:value="${token}">

            <div class="mb-3">
                <label class="form-label" for="newPassword">New password</label>
                <div class="mz-pw">
                    <input class="form-control" id="newPassword" name="newPassword" type="password"
                           autocomplete="new-password" minlength="8" required autofocus
                           placeholder="Enter new password">
                    <button type="button" class="mz-pw-toggle" data-mz-pw-toggle aria-label="Show password"><i class="bi bi-eye"></i></button>
                </div>
                <div id="pwdLengthMsg" class="form-text small mt-1 text-muted">
                    <i class="bi bi-info-circle me-1"></i>Must be at least 8 characters.
                </div>
            </div>

            <div class="mb-4">
                <label class="form-label" for="confirmPassword">Confirm new password</label>
                <div class="mz-pw">
                    <input class="form-control" id="confirmPassword" name="confirmPassword" type="password"
                           autocomplete="new-password" minlength="8" required
                           placeholder="Re-enter new password">
                    <button type="button" class="mz-pw-toggle" data-mz-pw-toggle aria-label="Show password"><i class="bi bi-eye"></i></button>
                </div>
                <!-- Inline match feedback directly below input -->
                <div id="pwdMatchMsg" class="mz-pw-match" hidden></div>
            </div>

            <button id="resetSubmitBtn" class="btn btn-primary w-100" type="submit">Update password</button>
        </form>

        <p class="small text-center mt-4 mb-0">
            Back to <a th:href="@{/login}">sign in</a>
        </p>
    </div>
</main>

<!-- Password error pop-up (from the server, or a check before submitting): closes itself after a moment (password-reset.js) -->
<div class="mz-custom-alert-overlay" id="mzResetErrorModal" th:hidden="${error == null}" role="alertdialog" aria-modal="true" aria-labelledby="mzResetErrorTitle">
    <div class="mz-custom-alert-card">
        <svg class="mz-pay-cross" viewBox="0 0 52 52" aria-hidden="true">
            <circle cx="26" cy="26" r="24"/>
            <path d="M17 17 L35 35 M35 17 L17 35"/>
        </svg>
        <h2 class="h4 mt-3 mb-1" id="mzResetErrorTitle">Password Error</h2>
        <p class="small text-muted mt-2 mb-2" id="mzResetErrorMsg" th:text="${error}">
            Passwords do not match.
        </p>
        <div class="small fw-semibold mt-3" style="color: #DC2626;">Try again</div>
    </div>
</div>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>

<script th:src="@{/js/password-reset.js}"></script>
</body>
</html>
