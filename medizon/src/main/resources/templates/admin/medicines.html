<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Catalog')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div th:replace="~{fragments/layout :: adminNav}"></div>
<div th:replace="~{fragments/layout :: flash}"></div>

<main class="container mz-page">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="mz-page-title mb-0">Catalog</h1>
        <a th:href="@{/admin/medicines/new}" class="btn btn-primary"><i class="bi bi-plus-lg me-1"></i>Add medicine</a>
    </div>
    <div class="mz-panel-flush">
        <div class="table-responsive">
            <table class="table align-middle mb-0">
                <thead><tr><th>Medicine</th><th>Category</th><th>Price</th><th>Stock</th><th>Expiry</th><th>Delivery</th><th>Rx</th><th>Status</th><th></th></tr></thead>
                <tbody>
                <tr th:each="m : ${medicines}" th:classappend="${!m.active} ? 'text-muted'">
                    <td><span class="fw-semibold" th:text="${m.name}"></span>
                        <span th:unless="${m.returnable}" class="badge text-bg-light border ms-1">Non-returnable</span>
                        <div class="small text-muted" th:text="${m.manufacturer}"></div></td>
                    <td th:text="${m.category}"></td>
                    <td th:text="'₹' + ${m.price}"></td>
                    <td th:text="${m.stock}" th:classappend="${m.stock < 50} ? 'text-danger fw-semibold'"></td>
                    <td class="text-nowrap">
                        <span th:if="${m.expiryDate == null}" class="text-muted">-</span>
                        <span th:if="${m.expiryDate != null}" th:text="${#temporals.format(m.expiryDate, 'MMM yyyy')}"
                              th:classappend="${m.expired} ? 'text-danger fw-semibold' : (${m.expiringSoon} ? 'text-warning-emphasis fw-semibold')"></span>
                        <span th:if="${m.expired}" class="badge text-bg-danger ms-1">Expired</span>
                        <span th:if="${m.expiringSoon}" class="badge text-bg-warning ms-1">Soon</span>
                    </td>
                    <td class="text-nowrap" th:with="lo=${m.deliveryMinDays ?: 3}, hi=${m.deliveryMaxDays ?: 5}">
                        <span th:if="${hi == 0}" class="badge text-bg-warning">Same day</span>
                        <span th:unless="${hi == 0}" th:text="${lo == hi} ? (${lo} + (${lo == 1} ? ' day' : ' days')) : (${lo} + '–' + ${hi} + ' days')"></span>
                    </td>
                    <td th:text="${m.prescriptionRequired} ? 'Yes' : 'No'"></td>
                    <td><span class="badge" th:classappend="${m.active} ? 'text-bg-success' : 'text-bg-secondary'" th:text="${m.active} ? 'Listed' : 'Hidden'"></span></td>
                    <td class="text-end text-nowrap">
                        <a th:href="@{/admin/medicines/{id}/edit(id=${m.id})}" class="btn btn-sm btn-outline-primary">Edit</a>
                        <form th:action="@{/admin/medicines/{id}/toggle(id=${m.id})}" method="post" class="d-inline">
                            <button class="btn btn-sm btn-outline-secondary" type="submit" th:text="${m.active} ? 'Hide' : 'List'">Hide</button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
