<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Alerts on this device')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div th:replace="~{fragments/layout :: flash}"></div>

<main class="container mz-page" style="max-width: 820px">
    <a th:href="@{/notifications}" class="small"><i class="bi bi-arrow-left"></i> Notifications</a>
    <h1 class="mz-page-title mt-2 mb-4">Alerts on this device</h1>

    <form th:action="@{/notifications/settings}" method="post" class="mz-panel mb-4" data-mz-device-form>
        <input type="hidden" name="deviceId" th:value="${here.id}">
        <div class="d-flex align-items-center gap-2 mb-3">
            <i class="bi bi-display fs-4 text-primary" aria-hidden="true"></i>
            <div class="flex-grow-1">
                <label class="form-label mb-0" for="label">This device</label>
                <input class="form-control" id="label" name="label" th:value="${here.label}" maxlength="60">
            </div>
        </div>

        <fieldset class="mb-3">
            <legend class="form-label fs-6">Show dose reminders and refill alerts for</legend>
            <div class="form-check">
                <input class="form-check-input" type="radio" name="allMembers" id="allYes" value="true" th:checked="${here.allMembers}" data-mz-all>
                <label class="form-check-label" for="allYes">Everyone</label>
            </div>
            <div class="form-check">
                <input class="form-check-input" type="radio" name="allMembers" id="allNo" value="false" th:checked="${!here.allMembers}" data-mz-all>
                <label class="form-check-label" for="allNo">Only these members</label>
            </div>
            <div class="mz-member-picks mt-2 ms-4" data-mz-member-picks>
                <label th:each="m : ${members}" class="mz-pick">
                    <input type="checkbox" name="memberIds" th:value="${m.id}" th:checked="${!here.allMembers and here.memberIds.contains(m.id)}">
                    <span><span class="mz-avatar mz-avatar-xs" th:classappend="${m.common} ? 'is-common'" th:text="${m.initial}" aria-hidden="true"></span>
                        <span th:text="${m.label}">Me</span></span>
                </label>
            </div>
        </fieldset>

        <div class="d-flex flex-wrap gap-2 align-items-center">
            <button class="btn btn-primary" type="submit">Save for this device</button>
            <button type="button" class="btn btn-outline-primary" data-mz-enable-alerts>
                <i class="bi bi-bell me-1"></i>Turn on desktop alerts</button>
        </div>
    </form>

    <section th:unless="${#lists.isEmpty(others)}">
        <h2 class="h5 mb-2">Other devices on your account</h2>
        <div class="mz-panel-flush">
            <div th:each="d : ${others}" class="mz-device-row">
                <i class="bi bi-phone text-primary fs-5" aria-hidden="true"></i>
                <div class="flex-grow-1">
                    <div class="fw-semibold" th:text="${d.label}">Chrome on Android</div>
                    <div class="small text-muted">
                        <span th:text="${d.configured} ? ${d.summary} : 'Everyone (not set up yet)'"></span> ·
                        <span th:text="'last used ' + ${#temporals.format(d.lastSeenAt, 'd MMM, h:mm a')}"></span>
                    </div>
                </div>
                <form th:action="@{/notifications/devices/{id}/forget(id=${d.id})}" method="post"
                      data-mz-confirm="Remove this device? It gets everyone's alerts again the next time you sign in there."
                      data-mz-confirm-ok="Remove">
                    <button class="btn btn-sm btn-link text-danger" type="submit">Remove</button>
                </form>
            </div>
        </div>
    </section>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
