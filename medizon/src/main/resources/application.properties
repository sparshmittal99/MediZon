spring.application.name=medizon

# ---------- PostgreSQL ----------
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/medizon}
spring.datasource.username=${DB_USER:medizon}
spring.datasource.password=${DB_PASSWORD:medizon}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=false

# ---------- Uploads (prescriptions, return photos) ----------
spring.servlet.multipart.max-file-size=5MB
# a return carries up to 3 photos; an upload up to 5 prescriptions of 5 MB
spring.servlet.multipart.max-request-size=26MB
# Read the rest of an over-limit upload, so the "file too big" page reaches the browser instead of a dropped connection
server.tomcat.max-swallow-size=40MB
medizon.upload-dir=${UPLOAD_DIR:uploads}

# ---------- App ----------
# First admin account, created on startup only if no admin exists yet. Further admins are added from Admin > Users.
medizon.admin.email=${MEDIZON_ADMIN_EMAIL:}
medizon.admin.password=${MEDIZON_ADMIN_PASSWORD:}
medizon.admin.name=${MEDIZON_ADMIN_NAME:}
# Seller details printed on GST tax invoices. The state decides CGST + SGST (same state) or IGST (other states).
medizon.seller.name=${SELLER_NAME:MediZon Pharmacy}
# Placeholder seller details until the real ones are set; override with the environment variables.
medizon.seller.gstin=${SELLER_GSTIN:27AABCM4521K1Z6}
medizon.seller.drug-license=${SELLER_DRUG_LICENSE:20B/MH-MZU/104512, 21B/MH-MZU/104513}
medizon.seller.address=${SELLER_ADDRESS:Shop 4, Green Park Plaza, Linking Road, Bandra West, Mumbai 400050}
medizon.seller.state=${SELLER_STATE:Maharashtra}
medizon.seller.phone=${SELLER_PHONE:+91 98200 45120}
medizon.seller.email=${SELLER_EMAIL:support@medizon.in}
# Base URL used in email links: BASE_URL if set (e.g. a custom domain), otherwise the address Render gives the
# service (it sets RENDER_EXTERNAL_URL on every web service), otherwise this machine for local runs
medizon.base-url=${BASE_URL:${RENDER_EXTERNAL_URL:http://localhost:8080}}
# Android App Links (/.well-known/assetlinks.json): links in emails open the app when it's installed. The SHA-256s of
# the certificates the app is signed with, comma separated: the release keystore, then this PC's debug keystore.
# With Google Play App Signing, add the "App signing key certificate" SHA-256 from the Play Console.
medizon.android.package=${ANDROID_PACKAGE:in.medizon.app}
medizon.android.cert-sha256=${ANDROID_CERT_SHA256:F4:EC:35:96:9E:76:C6:D1:D6:96:FB:4B:06:04:0F:47:45:9B:8F:19:AA:45:A8:D9:F9:69:68:B8:51:F6:71:49,AA:AA:5D:F4:8A:3A:09:69:75:23:2B:B9:88:14:E4:D6:D4:9F:1C:03:2B:A7:96:4E:79:D0:A8:0A:C4:F4:EB:BC}

# ---------- Email (Gmail / SMTP) ----------
# To enable real email delivery with your Google account:
# 1. Turn on 2-Step Verification on your Google Account (myaccount.google.com/security)
# 2. Create an App Password: Go to https://myaccount.google.com/apppasswords -> name it 'MediZon'
# 3. Set the environment variables (or edit below):
#      MAIL_ENABLED=true
#      MAIL_USER=your_email@gmail.com
#      MAIL_PASSWORD=your_16_character_app_password
#      MAIL_FROM=MediZon <your_email@gmail.com>
# When MAIL_ENABLED=false (default in dev), emails are simulated and logged to console.
medizon.mail.enabled=${MAIL_ENABLED:false}
medizon.mail.from=${MAIL_FROM:MediZon <no-reply@medizon.in>}
# With MAIL_DOMAIN set (e.g. medizon.dpdns.org) each kind of email has its own sender on that domain and MAIL_FROM
# is not used: orders and invoices from store@, returns return@, refunds refund@, payments payments@, the support
# desk support@, everything else noreply@. Each must be allowed to send at the mail provider.
medizon.mail.domain=${MAIL_DOMAIN:}
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USER:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.default-encoding=UTF-8
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=${MAIL_HOST:smtp.gmail.com}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# ---------- Online payment ----------
# Razorpay: test-mode keys (rzp_test_..., dashboard.razorpay.com > Test Mode > API Keys) take test payments.
# Without keys, cards and net banking aren't offered.
medizon.payment.razorpay.key-id=${RAZORPAY_KEY_ID:}
medizon.payment.razorpay.key-secret=${RAZORPAY_KEY_SECRET:}
# What the Razorpay account takes, of UPI, CARD and NETBANKING (Razorpay turns UPI on after KYC)
medizon.payment.razorpay.methods=${RAZORPAY_METHODS:CARD,NETBANKING}
# MediZon UPI: UPI apps, UPI ID and QR on the payment page in test mode, with no real money. Takes UPI unless Razorpay
# does (RAZORPAY_METHODS); false turns it off.
medizon.payment.upi.test-mode=${UPI_TEST_MODE:true}
# Razorpay webhook secret (dashboard > Settings > Webhooks; URL https://medizon-mze9.onrender.com/api/payments/razorpay/webhook, events
# payment.authorized, payment.captured, order.paid). With it a payment becomes its order within seconds even if the
# app closed or went offline right after paying. Without it the server still checks open payments every minute.
medizon.payment.razorpay.webhook-secret=${RAZORPAY_WEBHOOK_SECRET:}
# Payments the browser didn't confirm are checked with the gateway every minute (paid: the order is placed); one still
# unpaid this many minutes after it was started is closed
medizon.payment.settle-minutes=${PAYMENT_SETTLE_MINUTES:20}

# ---------- Assistant (built-in Python service in /medizon-assistant) ----------
medizon.assistant.url=${ASSISTANT_URL:http://localhost:8001}
# Shared secret sent as X-Assistant-Token; set the same ASSISTANT_TOKEN on the Python service
medizon.assistant.token=${ASSISTANT_TOKEN:}

# ---------- AI prescription reading ("upload a prescription, get your cart") ----------
# Which AI reads prescriptions. Off until its key is set; the pharmacist still verifies every prescription.
medizon.ai.provider=${AI_PROVIDER:gemini}
# Google Gemini (aistudio.google.com). The free tier may use what's sent to train Google's models:
# test with dummy prescriptions only, and use a paid key before real customers' prescriptions go through it.
medizon.ai.gemini.api-key=${GEMINI_API_KEY:}
medizon.ai.gemini.model=${GEMINI_MODEL:gemini-flash-latest}
# Groq (console.groq.com): answers chat questions the Python assistant can't, or all of them while it's down or
# asleep. Gemini takes over when Groq is down or out of quota. Text only: prescriptions are still read by Gemini.
medizon.ai.groq.api-key=${GROQ_API_KEY:}
medizon.ai.groq.model=${GROQ_MODEL:openai/gpt-oss-120b,openai/gpt-oss-20b}
# Readings scoring at least this (out of 100) with no AI concerns are fast-tracked: top of the pharmacist's queue.
# The pharmacist still approves every prescription.
medizon.ai.fast-track-score=${AI_FAST_TRACK_SCORE:80}

# ---------- Addresses and delivery location ----------
# Address suggestions while typing and the address at a map pin. Tried in order: Ola Maps, then LocationIQ, then
# OpenStreetMap's Nominatim (slower, one lookup a second for the whole site). One is skipped while it has no key, has
# used its daily limit, or failed in the last 2 minutes. Keys stay on the server.
# Ola Maps (maps.olakrutrim.com, Krutrim Cloud > Ola Maps > Maps Credentials): best for Indian addresses.
# The daily limit keeps a month inside the free allowance (about 100,000 a month).
medizon.location.ola.key=${OLA_MAPS_KEY:}
medizon.location.ola.daily-limit=${OLA_MAPS_DAILY_LIMIT:3200}
# LocationIQ (locationiq.com, free plan: 5,000 lookups a day, 2 a second).
medizon.location.locationiq.key=${LOCATIONIQ_KEY:}
medizon.location.locationiq.daily-limit=${LOCATIONIQ_DAILY_LIMIT:4800}
# India Post PIN code directory (api.postalpincode.in): city, state and post office areas of a PIN code. Free, no key.
medizon.location.indiapost.url=${INDIA_POST_URL:https://api.postalpincode.in}

# ---------- Monitoring (Admin > Monitoring, /actuator) ----------
# /actuator/health is public; /actuator/prometheus takes an admin session or "Authorization: Bearer <MONITORING_TOKEN>"
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when-authorized
management.endpoint.health.roles=ADMIN
# The assistant reports DEGRADED when it's down: listed, but the shop is still UP without it
management.endpoint.health.status.order=down,out-of-service,up,degraded,unknown
management.endpoint.health.status.http-mapping.degraded=200
management.health.mail.enabled=${MAIL_ENABLED:false}
management.metrics.tags.application=medizon
# p95 per endpoint, over the last 10 minutes
management.metrics.distribution.percentiles.http.server.requests=0.5,0.95,0.99
management.metrics.distribution.expiry.http.server.requests=10m
management.metrics.distribution.buffer-length.http.server.requests=5
medizon.monitoring.token=${MONITORING_TOKEN:}
# Requests slower than this are logged and listed under Admin > Monitoring
medizon.monitoring.slow-request-ms=${SLOW_REQUEST_MS:1000}
# Admins get a notification and an email when an error this severe or worse (CRITICAL, HIGH, MEDIUM, LOW) first
# happens, comes back after being resolved, or gets worse
medizon.monitoring.alert-severity=${ERROR_ALERT_SEVERITY:HIGH}
# Database queries slower than this are logged (org.hibernate.SQL_SLOW)
spring.jpa.properties.hibernate.log_slow_query=${SLOW_QUERY_MS:500}
# Every log line carries the request id, which the error page shows as the reference
logging.pattern.level=%5p [%X{requestId:-}]

# ---------- Security ----------
# Signs "Keep me signed in" cookies; set a long random secret in production (e.g. openssl rand -hex 32). Without it a
# random key is made at startup, so those cookies stop working after every restart
medizon.security.remember-me-key=${REMEMBER_ME_KEY:}
# Encrypts each account's authenticator-app (2FA) secret in the database; set a long random secret (openssl rand -hex 32)
# and never change it, or everyone's 2FA stops working (they'd sign in with a backup code, or the admin resets it).
# Without it the secrets are stored as they are.
medizon.security.two-factor-key=${TWO_FACTOR_KEY:}
# Render's proxy says the visitor's address and that the page came over HTTPS (X-Forwarded-For / -Proto): needed for
# Google's return address (https://.../login/oauth2/code/google), Secure cookies and per-address sign-in limits
server.forward-headers-strategy=native

# ---------- Sign in with Google (free: console.cloud.google.com > APIs & Services > Credentials) ----------
# A "Web application" OAuth client. Authorised redirect URIs: https://<each domain>/login/oauth2/code/google (and
# http://localhost:8080/login/oauth2/code/google for local runs). The Android app uses the same client ID; it also
# needs an "Android" OAuth client in the same project (package in.medizon.app + the signing key's SHA-1).
# Empty: no Google button anywhere.
medizon.google.client-id=${GOOGLE_CLIENT_ID:}
medizon.google.client-secret=${GOOGLE_CLIENT_SECRET:}

# ---------- New sign-in email ----------
# The approximate city in "new sign-in" emails, looked up from the visitor's IP address ({ip}). Free services limit
# use (freeipapi.com: no key, 60 lookups a minute). "off": the email leaves the city out.
medizon.geoip.url=${GEOIP_URL:https://free.freeipapi.com/api/v1/json/{ip}}

# ---------- Static files and compression ----------
# Browsers keep /css, /js and the icons for a year. Thymeleaf's @{...} links carry a hash of the file's content
# (medizon-3f9a2c.css), so a changed file gets a new URL and is fetched again
spring.web.resources.cache.cachecontrol.max-age=365d
spring.web.resources.cache.cachecontrol.cache-public=true
spring.web.resources.chain.strategy.content.enabled=true
spring.web.resources.chain.strategy.content.paths=/**
server.compression.enabled=true
server.compression.mime-types=text/html,text/css,application/javascript,application/json

# ---------- Templates ----------
# Templates are cached (compiled once) in production. Locally Spring DevTools turns the cache off by itself, so edited
# templates still show on refresh; never set spring.thymeleaf.cache=false here, or the live site re-reads every
# template on every request.
server.error.whitelabel.enabled=false

# ---------- Phone notifications for the Android app (Firebase Cloud Messaging, free) ----------
# The Firebase service account JSON (Project settings > Service accounts > Generate new private key), pasted as is or
# base64. Empty: no phone notifications (alarms still ring; everything else still shows in the app and by email).
medizon.push.service-account=${FIREBASE_SERVICE_ACCOUNT:}
# One health quote a day to customers' phones (Android app only), at a random time between 7 am and 9 pm
medizon.push.daily-quote=${DAILY_HEALTH_QUOTE:true}
