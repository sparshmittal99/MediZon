<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Something went wrong | MediZon</title>
    <link rel="icon" href="/favicon.ico" th:href="@{/favicon.ico}" sizes="any">
    <link rel="icon" href="/favicon.svg" th:href="@{/favicon.svg}" type="image/svg+xml">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" th:href="@{/apple-touch-icon.png}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/medizon.css}" rel="stylesheet">
</head>
<body>
<main class="container mz-page">
    <div class="mz-auth mz-panel text-center">
        <p class="mz-days mb-2" th:text="${status}">404</p>
        <h1 class="h4" th:text="${status == 404} ? 'Page not found' : (${status == 403} ? 'No access to this page' : 'Something went wrong')">Error</h1>
        <p class="text-muted">Go back to the home page and try again.</p>
        <p th:if="${requestId != null and status != null and status >= 500}" class="small text-muted">
            We've been told about this. If you contact us, quote reference <code th:text="${requestId}">a1b2c3</code>.</p>
        <a th:href="@{/}" class="btn btn-primary">Go to MediZon</a>
    </div>
</main>
</body>
</html>
