<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Manage users')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div th:replace="~{fragments/layout :: adminNav}"></div>
<div th:replace="~{fragments/layout :: flash}"></div>

<main class="container mz-page">
    <div class="d-flex flex-wrap justify-content-between align-items-end gap-3 mb-3">
        <h1 class="mz-page-title mb-0">Users</h1>
        <div class="d-flex flex-wrap gap-2">
            <form th:action="@{/admin/users}" method="get" class="d-flex gap-2" role="search">
                <input type="hidden" name="show" th:value="${show}">
                <input class="form-control" type="search" name="q" th:value="${q}" placeholder="Name, email or phone" aria-label="Search users">
                <button class="btn btn-outline-primary" type="submit">Search</button>
            </form>
            <button class="btn btn-primary text-nowrap" type="button" data-bs-toggle="collapse" data-bs-target="#mzNewUser"
                    aria-expanded="false" aria-controls="mzNewUser"><i class="bi bi-person-plus me-1"></i>New user</button>
        </div>
    </div>

    <!-- There's one admin (from the server's settings); the admin creates every other account with a role -->
    <div class="collapse" id="mzNewUser">
        <div class="mz-panel mb-4">
            <h2 class="h6 mb-1">Create an account</h2>
            <p class="small text-muted mb-3">Each role only sees its own pages. Store accounts work for one store.</p>
            <form th:action="@{/admin/users}" method="post" class="row g-3" autocomplete="off" data-mz-new-user>
                <div class="col-md-4">
                    <label class="form-label small" for="newName">Full name</label>
                    <input id="newName" class="form-control" name="fullName" required>
                </div>
                <div class="col-md-4">
                    <label class="form-label small" for="newEmail">Email</label>
                    <input id="newEmail" class="form-control" type="email" name="email" required autocomplete="off">
                </div>
                <div class="col-md-4">
                    <label class="form-label small" for="newPhone">Mobile <span class="text-muted fw-normal">(optional)</span></label>
                    <input id="newPhone" class="form-control" name="phone" inputmode="tel">
                </div>
                <div class="col-md-4">
                    <label class="form-label small" for="newRole">Role</label>
                    <select id="newRole" class="form-select" name="role" required data-mz-role>
                        <option th:each="r : ${roles}" th:value="${r}" th:text="${r.label} + ': ' + ${r.description}"></option>
                    </select>
                </div>
                <div class="col-md-4" data-mz-store-pick hidden>
                    <label class="form-label small" for="newStore">Store</label>
                    <select id="newStore" class="form-select" name="storeId">
                        <option value="">Choose a store</option>
                        <option th:each="s : ${stores}" th:value="${s.id}" th:text="${s.name}"></option>
                    </select>
                    <div class="form-text" th:if="${#lists.isEmpty(stores)}">Add a store first, under <a th:href="@{/admin/stores}">Stores</a>.</div>
                </div>
                <div class="col-md-4">
                    <label class="form-label small" for="newPassword">Password</label>
                    <input id="newPassword" class="form-control" type="password" name="password" minlength="8" required autocomplete="new-password">
                </div>
                <div class="col-12">
                    <button class="btn btn-primary" type="submit">Create account</button>
                </div>
            </form>
        </div>
    </div>

    <div class="d-flex flex-wrap gap-2 mb-4">
        <a th:each="f : ${#strings.arraySplit('all,customers,staff,new,online,disabled', ',')}" class="mz-chip"
           th:classappend="${show == f} ? 'active'" th:href="@{/admin/users(show=${f}, q=${q})}"
           th:text="${f == 'new'} ? 'New this week' : (${f == 'online'} ? 'Online now' : ${#strings.capitalize(f)})"></a>
    </div>

    <div th:if="${#lists.isEmpty(users)}" class="mz-panel mz-empty"><i class="bi bi-people"></i><p class="mb-0">No users match.</p></div>
    <div th:unless="${#lists.isEmpty(users)}" class="mz-panel-flush">
        <div class="table-responsive">
            <table class="table align-middle mb-0">
                <thead><tr><th>User</th><th>Role</th><th>Joined</th><th>Last sign-in</th><th class="text-end">Sign-ins</th>
                    <th class="text-end">Orders</th><th>Status</th><th class="text-end">Actions</th></tr></thead>
                <tbody>
                <tr th:each="u : ${users}" th:with="isMe=${u.id == me.id}, isOnline=${online.contains(#strings.toLowerCase(u.email))}"
                    th:classappend="${!u.enabled} ? 'mz-user-off'">
                    <td>
                        <div class="fw-semibold">
                            <span th:if="${isOnline}" class="mz-online me-1" title="Online now"></span>
                            <span th:text="${u.fullName}"></span>
                            <span th:if="${isMe}" class="badge text-bg-light ms-1">You</span>
                            <span th:if="${u.createdAt != null and u.createdAt.isAfter(newSince)}" class="badge mz-auto-badge ms-1">New</span>
                        </div>
                        <div class="small text-muted" th:text="${u.email}"></div>
                        <div class="small text-muted" th:if="${u.phone}" th:text="${u.phone}"></div>
                    </td>
                    <td><span class="badge" th:classappend="${u.admin} ? 'text-bg-dark' : (${u.staff} ? 'text-bg-primary' : 'text-bg-light')"
                              th:text="${u.role.label}"></span>
                        <div class="small text-muted" th:if="${u.store != null}" th:text="${u.store.name}"></div></td>
                    <td class="text-nowrap small" th:text="${u.createdAt != null} ? ${#temporals.format(u.createdAt, 'd MMM yyyy')} : '–'"></td>
                    <td class="text-nowrap small" th:text="${u.lastLoginAt != null} ? ${#temporals.format(u.lastLoginAt, 'd MMM, h:mm a')} : 'Never'"></td>
                    <td class="text-end" th:text="${u.loginCount}">0</td>
                    <td class="text-end" th:text="${orderCounts.getOrDefault(u.id, 0L)}">0</td>
                    <td><span class="badge" th:classappend="${u.enabled} ? 'text-bg-success' : 'text-bg-danger'"
                              th:text="${u.enabled} ? 'Active' : 'Disabled'"></span></td>
                    <td class="text-end">
                        <div th:unless="${isMe or u.admin and u.enabled}" class="dropdown">
                            <button class="btn btn-sm btn-outline-secondary dropdown-toggle" type="button" data-bs-toggle="dropdown"
                                    aria-expanded="false" th:attr="aria-label='Actions for ' + ${u.fullName}">Manage</button>
                            <ul class="dropdown-menu dropdown-menu-end">
                                <li th:if="${u.enabled}">
                                    <form th:action="@{/admin/users/{id}/enabled(id=${u.id})}" method="post"
                                          th:attr="data-mz-confirm=${u.fullName} + ' won\'t be able to sign in, and will be signed out of every device now.'"
                                          data-mz-confirm-title="Disable account" data-mz-confirm-ok="Disable">
                                        <input type="hidden" name="enabled" value="false">
                                        <button class="dropdown-item text-danger" type="submit"><i class="bi bi-slash-circle me-2"></i>Disable account</button>
                                    </form>
                                </li>
                                <li th:unless="${u.enabled or u.admin}">
                                    <form th:action="@{/admin/users/{id}/enabled(id=${u.id})}" method="post">
                                        <input type="hidden" name="enabled" value="true">
                                        <button class="dropdown-item" type="submit"><i class="bi bi-check-circle me-2"></i>Enable account</button>
                                    </form>
                                </li>
                                <li th:if="${isOnline}">
                                    <form th:action="@{/admin/users/{id}/sign-out(id=${u.id})}" method="post">
                                        <button class="dropdown-item" type="submit"><i class="bi bi-box-arrow-right me-2"></i>Sign out everywhere</button>
                                    </form>
                                </li>
                                <li><hr class="dropdown-divider"></li>
                                <li>
                                    <form th:action="@{/admin/users/{id}/delete(id=${u.id})}" method="post"
                                          th:attr="data-mz-confirm=${u.fullName} + '\'s personal data will be deleted and they can\'t sign in again. Orders and invoices stay for the accounts, without personal details.'"
                                          data-mz-confirm-title="Delete account" data-mz-confirm-ok="Delete">
                                        <button class="dropdown-item text-danger" type="submit"><i class="bi bi-trash me-2"></i>Delete account</button>
                                    </form>
                                </li>
                            </ul>
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
    <p class="small text-muted mt-3 mb-0" th:text="${#lists.size(users)} + ' user(s) shown'"></p>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
