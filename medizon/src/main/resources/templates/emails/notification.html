<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="x-apple-disable-message-reformatting">
    <title th:text="${title}">MediZon Notification</title>
    <style>
        @media only screen and (max-width: 520px) {
            .mz-wrap { padding: 12px 6px !important; }
            .mz-card { width: 100% !important; max-width: 100% !important; border-radius: 8px !important; }
            .mz-header { padding: 18px 20px !important; }
            .mz-body { padding: 22px 18px !important; }
            .mz-footer { padding: 18px 20px !important; }
            .header-col-brand { display: block !important; width: 100% !important; text-align: left !important; }
            .header-col-badge { display: block !important; width: 100% !important; text-align: left !important; padding-top: 12px !important; }
            .mz-btn { display: block !important; width: 100% !important; margin: 6px 0 !important; box-sizing: border-box !important; text-align: center !important; }
        }
    </style>
</head>
<body style="margin: 0; padding: 0; background-color: #F6F9F7; font-family: 'Figtree', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; color: #17302A; line-height: 1.5; -webkit-font-smoothing: antialiased;">

    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background-color: #F6F9F7; padding: 32px 16px;" class="mz-wrap">
        <tr>
            <td align="center">
                <table role="presentation" width="100%" class="mz-card" style="max-width: 560px; background-color: #ffffff; border-radius: 12px; border: 1px solid #D3E3DB; overflow: hidden; box-shadow: 0 4px 12px rgba(23, 48, 42, 0.05);" cellspacing="0" cellpadding="0">
                    
                    <!-- Header -->
                    <tr>
                        <td class="mz-header" style="background-color: #0E6B57; padding: 22px 30px; text-align: left;">
                            <table role="presentation" width="100%" cellspacing="0" cellpadding="0">
                                <tr>
                                    <td class="header-col-brand" valign="middle">
                                        <table role="presentation" cellspacing="0" cellpadding="0" style="display: inline-table; vertical-align: middle;">
                                            <tr>
                                                <td style="vertical-align: middle; padding-right: 11px; line-height: 0;">
                                                    <img src="cid:medizonLogo" width="34" height="34" alt="MediZon"
                                                         style="display: block; width: 34px; height: 34px; border: 0; outline: none; background: transparent;" />
                                                </td>
                                                <td style="vertical-align: middle; line-height: 1;">
                                                    <span style="font-size: 24px; font-weight: 800; color: #ffffff; letter-spacing: -0.5px; text-decoration: none; font-family: 'Figtree', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; display: inline-block; vertical-align: middle; line-height: 1;">
                                                        MediZon
                                                    </span>
                                                </td>
                                            </tr>
                                        </table>
                                    </td>
                                    <td class="header-col-badge" align="right" valign="middle" th:if="${typeLabel != null}">
                                        <span style="display: inline-block; background-color: #E6F2EC; color: #0A4E40; padding: 5px 14px; border-radius: 20px; font-size: 12px; font-weight: 700; white-space: nowrap; line-height: 1;" th:text="${typeLabel}">
                                            Notification
                                        </span>
                                    </td>
                                </tr>
                            </table>
                        </td>
                    </tr>

                    <!-- Body -->
                    <tr>
                        <td class="mz-body" style="padding: 30px;">
                            <h1 style="margin: 0 0 16px 0; font-size: 20px; font-weight: 700; color: #17302A;" th:text="${title}">
                                Notification Title
                            </h1>
                            <p style="margin: 0 0 12px 0; font-size: 15px; color: #5B716A;" th:if="${user != null}">
                                Hi <span th:text="${user.firstName}">User</span>,
                            </p>
                            
                            <div style="background-color: #F6F9F7; border-radius: 8px; border: 1px solid #D3E3DB; padding: 18px; margin: 16px 0 24px 0; font-size: 15px; color: #17302A; line-height: 1.6;">
                                <p style="margin: 0; white-space: pre-line;" th:text="${message}">Notification message details go here.</p>
                            </div>

                            <!-- CTA Button if actionUrl is present -->
                            <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="margin-bottom: 12px;" th:if="${actionUrl != null and !#strings.isEmpty(actionUrl)}">
                                <tr>
                                    <td align="center">
                                        <a th:href="${actionUrl}" target="_blank" class="mz-btn" style="display: inline-block; background-color: #0E6B57; color: #ffffff; text-decoration: none; font-size: 14px; font-weight: 700; padding: 12px 28px; border-radius: 8px; box-shadow: 0 2px 6px rgba(14, 107, 87, 0.25);">
                                            Open in MediZon &rarr;
                                        </a>
                                    </td>
                                </tr>
                            </table>

                        </td>
                    </tr>

                    <!-- Footer -->
                    <tr>
                        <td class="mz-footer" style="background-color: #F6F9F7; border-top: 1px solid #D3E3DB; padding: 20px 30px; text-align: center; font-size: 12px; color: #5B716A;">
                            <p style="margin: 0 0 10px 0;">You received this email according to your notification preferences.<br><a th:href="${baseUrl} + '/notifications/settings'" target="_blank" style="display: inline-block; background-color: #ffffff; color: #0E6B57; text-decoration: none; font-size: 12px; font-weight: 700; line-height: 1.2; padding: 6px 14px; border-radius: 6px; border: 1px solid #0E6B57; margin: 6px 3px 0 3px;">Notification preferences</a></p>
                            <p style="margin: 0; color: #7B908A;">MediZon Pharmacy &bull; Your Trusted Health Partner</p>
                        </td>
                    </tr>

                </table>
            </td>
        </tr>
    </table>

</body>
</html>
